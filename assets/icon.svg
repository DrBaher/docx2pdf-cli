<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#fdfcf9"/>
  <!-- source DOCX document on the left -->
  <path d="M 80 130 L 200 130 L 240 170 L 240 380 L 80 380 Z"
        fill="#fdfcf9" stroke="#1f7d5d" stroke-width="14" stroke-linejoin="round"/>
  <path d="M 200 130 L 240 170 L 200 170 Z"
        fill="#1f7d5d" stroke="#1f7d5d" stroke-width="14" stroke-linejoin="round"/>
  <!-- W label -->
  <text x="100" y="285" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#1f7d5d">W</text>
  <!-- conversion arrow in the middle -->
  <path d="M 260 256 L 320 256"
        fill="none" stroke="#0e4a37" stroke-width="18" stroke-linecap="round"/>
  <path d="M 304 232 L 328 256 L 304 280"
        fill="none" stroke="#0e4a37" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- destination PDF document on the right (filled) -->
  <rect x="340" y="130" width="92" height="250" rx="6"
        fill="#1f7d5d" stroke="#1f7d5d" stroke-width="14" stroke-linejoin="round"/>
  <!-- PDF label -->
  <text x="346" y="270" font-family="Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#fdfcf9" letter-spacing="-1">PDF</text>
</svg>
